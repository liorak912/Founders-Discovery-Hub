kind = "web"
previewPath = "/"
title = "Discovery"
description = "An AI-guided customer discovery workspace for first-time founders with industry briefs, interview planning, evidence synthesis, and contextual chat."
version = "1.0.0"
id = "artifacts/discovery"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21113

[services.development]
run = "pnpm --filter @workspace/discovery run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/discovery", "run", "build" ]
serve = "static"
publicDir = "artifacts/discovery/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21113"
BASE_PATH = "/"
