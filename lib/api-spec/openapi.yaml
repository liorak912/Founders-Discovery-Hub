openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /discovery/directions:
    post:
      operationId: generateDirections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FounderInput"
      responses:
        "200":
          description: Five problem-first directions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectionsOutput"
  /discovery/interview-ideas:
    post:
      operationId: generateInterviewIdeas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewIdeasInput"
      responses:
        "200":
          description: Evidence-grounded ideas and research gaps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewIdeasOutput"
  /discovery/generate:
    post:
      operationId: generateDiscovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoveryInput"
      responses:
        "200":
          description: Generated discovery content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryOutput"
  /discovery/chat:
    post:
      operationId: chatDiscovery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatInput"
      responses:
        "200":
          description: Contextual answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryOutput"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    FounderInput:
      type: object
      properties:
        skills: { type: string, maxLength: 3000 }
        interests: { type: string, maxLength: 3000 }
        experience: { type: string, maxLength: 3000 }
        problems: { type: string, maxLength: 3000 }
        seedDirection: { type: string, maxLength: 6000 }
    StartupDirection:
      type: object
      required: [title, industry, problem, customer, founderFit, solution]
      properties:
        title: { type: string }
        industry: { type: string, maxLength: 300 }
        problem: { type: string }
        customer: { type: string, maxLength: 1000 }
        founderFit: { type: string }
        solution: { type: string }
    DirectionsOutput:
      type: object
      required: [ideas]
      properties:
        ideas:
          type: array
          minItems: 5
          maxItems: 5
          items: { $ref: "#/components/schemas/StartupDirection" }
    InterviewIdeasInput:
      type: object
      required: [notes]
      properties:
        notes: { type: string, minLength: 1, maxLength: 40000 }
        industry: { type: string, maxLength: 300 }
        sample: { type: boolean }
    EvidenceQuote:
      type: object
      required: [text, participant]
      properties:
        text: { type: string, minLength: 1 }
        participant: { type: ["string", "null"] }
    ParticipantEvidence:
      type: object
      required: [label, excerpt]
      properties:
        label: { type: string, minLength: 1 }
        excerpt: { type: string, minLength: 1 }
    InterviewIdea:
      type: object
      required: [title, problem, participantCount, participants, quotes, evidenceCaveat, targetSegment, painIntensity, solution, workarounds, willingnessToPay, riskiestAssumption, cheapestTest, painSeverity, frequency, evidenceStrength, scoreRationale]
      properties:
        title: { type: string }
        problem: { type: string }
        participantCount: { type: ["integer", "null"], minimum: 0 }
        participants:
          type: array
          items: { $ref: "#/components/schemas/ParticipantEvidence" }
        quotes:
          type: array
          maxItems: 2
          items: { $ref: "#/components/schemas/EvidenceQuote" }
        evidenceCaveat: { type: string }
        targetSegment: { type: string }
        painIntensity: { type: string }
        solution: { type: string }
        workarounds: { type: string }
        willingnessToPay: { type: string }
        riskiestAssumption: { type: string }
        cheapestTest: { type: string }
        painSeverity: { type: integer, minimum: 1, maximum: 5 }
        frequency: { type: integer, minimum: 1, maximum: 5 }
        evidenceStrength: { type: integer, minimum: 1, maximum: 5 }
        scoreRationale: { type: string }
    InterviewIdeasOutput:
      type: object
      required: [ideas, gaps, followUpQuestions]
      properties:
        ideas:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/InterviewIdea" }
        gaps:
          type: array
          items: { type: string }
        followUpQuestions:
          type: array
          minItems: 2
          maxItems: 3
          items: { type: string }
    DiscoveryInput:
      type: object
      required: [industry, section]
      properties:
        industry: { type: string, minLength: 1, maxLength: 300 }
        idea: { type: string, maxLength: 3000 }
        customer: { type: string, maxLength: 1000 }
        section: { type: string, enum: [brief, people, kit, synthesis] }
        context: { type: string, maxLength: 45000 }
        notes: { type: string, maxLength: 40000 }
    ChatInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 4000 }
        context: { type: string, maxLength: 60000 }
        history:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ChatMessage"
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, maxLength: 12000 }
    DiscoveryOutput:
      type: object
      required: [content]
      properties:
        content: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

